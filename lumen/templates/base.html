<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{% block title %}Lumen Archive{% endblock %}</title>
  <meta name="description" content="{% block description %}A library of knowledge from every field, behind a door of light.{% endblock %}">
  <meta name="theme-color" content="#07090F">
  <link rel="icon" href="{{ url_for('static', filename='img/favicon.svg') }}" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Inter:wght@400;500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}?v={{ config.ASSET_VERSION }}">
  {% block head %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}">
  <a href="#main" class="sr-only focus:not-sr-only focus:fixed focus:left-4 focus:top-4 focus:z-[100] focus:rounded-lg focus:bg-gold-400 focus:px-4 focus:py-2 focus:text-wood-900">Skip to content</a>
  {% block body %}{% endblock %}
  <script src="{{ url_for('static', filename='js/nav.js') }}?v={{ config.ASSET_VERSION }}" defer></script>
  {% block scripts %}{% endblock %}
</body>
</html>
